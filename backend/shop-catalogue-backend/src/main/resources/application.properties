spring.application.name=shop-catalogue

# Every value below can be overridden by an environment variable of the same
# name (the part before the colon is the env var, after the colon is the
# fallback used when that env var isn't set - e.g. your local machine).
# Locally, none of these env vars exist, so it behaves exactly as before.
# On Render (or any host), set the env vars in the dashboard and these
# defaults are ignored automatically - no code change needed to deploy.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_catalogue?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sandeep@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render (and most hosts) assign the port dynamically via $PORT - this falls
# back to 8080 for local development where no such variable exists.
server.port=${PORT:8080}

# WhatsApp number that receives customer orders.
# Use country code, without + or spaces. Example: 919966343377
shop.whatsapp.number=${WHATSAPP_NUMBER:9705333210}

# Initial owner account created when the application starts.
shop.owner.email=${OWNER_EMAIL:owner@shop.com}
shop.owner.password=${OWNER_PASSWORD:ChangeMe123!}
shop.owner.name=${OWNER_NAME:Shop Owner}
shop.owner.shop-name=${OWNER_SHOP_NAME:Anuradha agencies}
shop.owner.phone=${OWNER_PHONE:9848903210}

shop.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToAtLeast32CharactersLong!}
